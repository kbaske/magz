<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Magazine</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Noto+Sans+Ol+Chiki:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #202124;
        --sub: #5f6368;
        --line: #dadce0;
        --bg: #fff;
        --accent: #e06900;
        --gap: 36px;
        --n: 6;
      }
      @media (max-width: 1499px) {
        :root {
          --n: 5;
        }
      }
      @media (max-width: 1199px) {
        :root {
          --n: 4;
        }
      }
      @media (max-width: 899px) {
        :root {
          --n: 3;
          --gap: 24px;
        }
      }
      @media (max-width: 599px) {
        :root {
          --n: 2.3;
          --gap: 14px;
        }
        .cat[data-open="1"] {
          --n: 2;
        }
      }
      * {
        box-sizing: border-box;
      }
      html.lock,
      html.lock body {
        overflow: hidden;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Roboto, "Noto Sans Ol Chiki", system-ui, sans-serif;
      }
      svg {
        display: block;
        fill: currentColor;
      }

      /* app bar */
      .appbar {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--bg);
        border-bottom: 1px solid #e8eaed;
        padding: 12px 20px;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
      }
      .brand {
        font-size: 22px;
        font-weight: 500;
        font-family: "Noto Sans Ol Chiki", Roboto, sans-serif;
      }
      .search {
        flex: 1;
        min-width: 220px;
        max-width: 680px;
        display: flex;
        align-items: center;
        gap: 12px;
        height: 48px;
        padding: 0 16px;
        border-radius: 24px;
        background: #f1f3f4;
        color: var(--sub);
        transition:
          background 0.15s,
          box-shadow 0.15s;
      }
      .search:focus-within {
        background: #fff;
        box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
      }
      #q {
        flex: 1;
        border: 0;
        outline: 0;
        background: none;
        font: inherit;
        font-size: 16px;
        color: var(--ink);
        min-width: 0;
      }
      [hidden] {
        display: none !important;
      }
      main {
        padding: 8px clamp(16px, 5.2vw, 100px) 64px;
        max-width: 1920px;
        margin: 0 auto;
      }
      .cat,
      .genres {
        margin-top: 28px;
      }
      .cat {
        scroll-margin-top: 76px;
      }
      .cat-h {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 12px;
      }
      .cat-h h2 {
        margin: 0;
        font-size: clamp(22px, 2.4vw, 36px);
        font-weight: 500;
      }
      .va {
        margin-left: auto;
        height: clamp(40px, 3.6vw, 64px);
        padding: 0 clamp(20px, 2vw, 32px);
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-size: clamp(15px, 1.3vw, 21px);
        cursor: pointer;
      }
      .va:hover,
      .nav:hover,
      #top:hover {
        filter: brightness(1.1);
      }

      /* carousel */
      .car {
        position: relative;
      }
      .track {
        display: flex;
        gap: var(--gap);
        overflow-x: auto;
        padding: 14px 20px 20px;
        margin: 0 -20px;
        scroll-snap-type: x proximity;
        scroll-padding-inline: 20px;
        scrollbar-width: none;
      }
      .track::-webkit-scrollbar {
        display: none;
      }
      .track > .card,
      .track > .tile {
        flex: 0 0 calc((100% - (var(--n) - 1) * var(--gap)) / var(--n));
        scroll-snap-align: start;
      }
      .cat[data-open="1"] .track {
        flex-wrap: wrap;
        overflow: visible;
        row-gap: 28px;
        scroll-snap-type: none;
      }
      .nav {
        position: absolute;
        top: 38%;
        transform: translateY(-50%);
        z-index: 2;
        width: 52px;
        height: 52px;
        border: 0;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        display: grid;
        place-items: center;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }
      .genres .nav {
        top: 50%;
      }
      .nav.prev {
        left: -6px;
      }
      .nav.next {
        right: -6px;
      }
      .cat[data-open="1"] .nav {
        display: none;
      }
      @media (hover: none) {
        .nav {
          display: none;
        }
      }
      #top {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 6;
        width: 48px;
        height: 48px;
        border: 0;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        display: grid;
        place-items: center;
        cursor: pointer;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
      }

      /* genre tiles */
      .tile {
        all: unset;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 24px 10px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.14);
        cursor: pointer;
        text-align: center;
        min-width: 0;
        transition:
          box-shadow 0.15s,
          transform 0.15s;
      }
      .tile:hover,
      .tile:focus-visible {
        box-shadow: 0 5px 16px rgba(224, 105, 0, 0.3);
        transform: translateY(-2px);
      }
      .tile:focus-visible,
      .card:focus-visible {
        outline: 3px solid var(--accent);
      }
      .ti {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 30px;
        font-weight: 700;
        font-family: "Noto Sans Ol Chiki", Roboto, sans-serif;
      }
      .tn {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: clamp(15px, 1.1vw, 18px);
        font-weight: 500;
      }
      .tc {
        color: var(--sub);
        font-size: clamp(14px, 1vw, 17px);
      }
      .tc b {
        color: var(--accent);
        font-weight: 500;
      }

      /* book cards */
      .card {
        all: unset;
        box-sizing: border-box;
        position: relative;
        isolation: isolate;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        cursor: pointer;
        min-width: 0;
        transition: transform 0.2s;
      }
      .card::before {
        content: "";
        position: absolute;
        inset: -14px -16px -12px;
        z-index: -1;
        border-radius: 4px;
        background: #fcf6ee;
        box-shadow: 0 3px 14px rgba(0, 0, 0, 0.14);
        opacity: 0;
        transition: opacity 0.18s;
      }
      .b3d {
        display: block;
        position: relative;
        width: 100%;
        aspect-ratio: 2/3;
        perspective: 900px;
        margin-bottom: 16px;
      }
      .pages {
        position: absolute;
        inset: 1.5% 0;
        border-radius: 0 3px 3px 0;
        background: linear-gradient(90deg, #f1ebe0, #fff);
        opacity: 0;
        transition: opacity 0.2s;
        box-shadow:
          3px 0 0 #fff,
          4px 0 0 #cfc8bb,
          7px 0 0 #fff,
          8px 0 0 #cfc8bb,
          11px 0 0 #fff,
          12px 0 0 #bdb5a6;
      }
      .cover {
        position: absolute;
        inset: 0;
        border-radius: 3px;
        background: var(--c, #a23b4a);
        overflow: hidden;
        box-shadow: 2px 3px 8px rgba(0, 0, 0, 0.3);
        transform-origin: left center;
        transition:
          transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1),
          box-shadow 0.35s;
      }
      .cover::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.35) 0,
          rgba(0, 0, 0, 0.18) 3%,
          transparent 7%
        );
      }
      .cover img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .ph {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px;
        color: #fff;
        font-family: "Noto Sans Ol Chiki", Roboto, sans-serif;
      }
      .ph b {
        font-size: 22px;
      }
      .ph span {
        font-size: 12px;
        font-family: Roboto, sans-serif;
      }
      .card:focus-visible::before {
        opacity: 1;
      }
      @media (hover: hover) {
        .card:hover {
          transform: translateY(-3px);
        }
        .card:hover::before {
          opacity: 1;
        }
        .card:hover .pages {
          opacity: 1;
        }
        .card:hover .cover {
          transform: rotateY(-24deg);
          box-shadow: 10px 6px 16px rgba(0, 0, 0, 0.35);
        }
      }
      .ct,
      .cs {
        display: block;
        width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ct {
        font-size: clamp(15px, 1.05vw, 17px);
        font-weight: 500;
      }
      .cs {
        margin-top: 6px;
        font-size: clamp(13px, 0.95vw, 16px);
        color: var(--sub);
      }
      .empty {
        margin: 48px 0;
        text-align: center;
        color: var(--sub);
      }

      /* reader */
      #reader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 100dvh;
        background: #202124;
        color: #e8eaed;
        display: none;
        flex-direction: column;
        z-index: 10;
      }
      #reader.on {
        display: flex;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 4px 12px;
      }
      .titlebar {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        flex: 0 1 320px;
      }
      .t {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 16px;
      }
      .tools {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        visibility: hidden;
      }
      #reader.ready .tools {
        visibility: visible;
      }
      #reader button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        cursor: pointer;
        flex: none;
      }
      #reader button:hover:not(:disabled) {
        background: #ffffff1f;
      }
      #reader button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      #reader button:focus-visible,
      #goto:focus-visible {
        outline: 2px solid #8ab4f8;
      }
      #reader .pill {
        width: auto;
        border-radius: 20px;
        padding: 0 14px;
        font-size: 14px;
        font-weight: 500;
        color: #8ab4f8;
      }
      #seek {
        flex: 1;
        min-width: 60px;
        accent-color: #8ab4f8;
        margin: 0 8px;
      }
      .go {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        white-space: nowrap;
      }
      #goto {
        width: 52px;
        height: 32px;
        font: inherit;
        text-align: center;
        border-radius: 8px;
        border: 1px solid #5f6368;
        background: #303134;
        color: #e8eaed;
      }
      .zoom {
        display: flex;
        align-items: center;
      }
      #stage {
        flex: 1;
        min-height: 0;
        display: flex;
        overflow: hidden;
        padding: 4px;
      }
      #stage.zoomed {
        overflow: auto;
        scrollbar-width: thin;
        cursor: grab;
      }
      #stage.zoomed.grabbing {
        cursor: grabbing;
      }
      #stage.zoomed * {
        touch-action: pan-x pan-y pinch-zoom !important;
      }
      .flip {
        margin: auto;
        flex: none;
      }
      .page {
        background: #fff;
        position: relative;
      }
      .spin {
        position: absolute;
        inset: 0;
        margin: auto;
        width: 30px;
        height: 30px;
        border: 3px solid #e0e0e0;
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: sp 1s linear infinite;
      }
      @keyframes sp {
        to {
          transform: rotate(360deg);
        }
      }
      .fail {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 12px;
        text-align: center;
        font-size: 14px;
        color: #5f6368;
      }
      #bg {
        height: 3px;
        flex: none;
        background: #ffffff1a;
      }
      #bg.done {
        visibility: hidden;
      }
      #bg i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--accent);
        transition: width 0.2s;
      }
      .page img {
        width: 100%;
        height: 100%;
        display: block;
        user-select: none;
        -webkit-user-drag: none;
      }
      #msg {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-align: center;
        padding: 24px;
        pointer-events: none;
      }
      #msg.hide {
        display: none;
      }
      #prog {
        width: 220px;
        height: 4px;
        border-radius: 2px;
        background: #ffffff30;
        overflow: hidden;
      }
      #prog i {
        display: block;
        height: 100%;
        width: 0;
        background: #8ab4f8;
      }

      @media (max-width: 719px) {
        .appbar {
          padding: 10px 12px;
        }
        .brand {
          font-size: 20px;
        }
        .bar {
          display: contents;
        }
        .titlebar {
          order: 0;
          padding: 4px 8px;
          flex: none;
        }
        #stage {
          order: 1;
        }
        .tools {
          order: 2;
          flex: none;
          flex-wrap: wrap;
          justify-content: center;
          gap: 4px 6px;
          padding: 0 8px calc(8px + env(safe-area-inset-bottom, 0px));
        }
        #seek {
          order: -1;
          flex: none;
          width: 100%;
          margin: 0;
        }
        #reader button {
          width: 36px;
          height: 36px;
        }
        .pl,
        #zval {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .card,
        .tile,
        .search,
        .cover,
        .pages,
        .card::before {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="appbar">
      <div class="top">
        <div class="brand">Magazine</div>
        <label class="search">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
            <path
              d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
            />
          </svg>
          <input
            id="q"
            type="search"
            placeholder="Search title or author"
            aria-label="Search issues"
          />
        </label>
      </div>
    </header>
    <main id="shelves"></main>
    <button id="top" hidden aria-label="Back to top">
      <svg viewBox="0 0 24 24" width="24" height="24">
        <path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z" />
      </svg>
    </button>

    <div
      id="reader"
      role="dialog"
      aria-modal="true"
      aria-label="Magazine reader"
    >
      <header class="bar">
        <div class="titlebar">
          <button id="close" aria-label="Back">
            <svg viewBox="0 0 24 24" width="24" height="24">
              <path
                d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"
              />
            </svg>
          </button>
          <span class="t" id="rtitle"></span>
        </div>
        <div class="tools">
          <input
            type="range"
            id="seek"
            min="1"
            max="1"
            value="1"
            aria-label="Reading progress"
          />
          <button id="prev" aria-label="Previous page">
            <svg viewBox="0 0 24 24" width="24" height="24">
              <path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
            </svg>
          </button>
          <label class="go"
            ><span class="pl">Page</span
            ><input id="goto" type="number" min="1" inputmode="numeric" /> /
            <span id="total">0</span></label
          >
          <button id="gobtn" class="pill">Go</button>
          <button id="next" aria-label="Next page">
            <svg viewBox="0 0 24 24" width="24" height="24">
              <path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" />
            </svg>
          </button>
          <span class="zoom">
            <button id="zout" aria-label="Zoom out">
              <svg viewBox="0 0 24 24" width="24" height="24">
                <path d="M19 13H5v-2h14v2z" />
              </svg>
            </button>
            <button id="zval" class="pill" aria-label="Reset zoom">100%</button>
            <button id="zin" aria-label="Zoom in">
              <svg viewBox="0 0 24 24" width="24" height="24">
                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
              </svg>
            </button>
          </span>
        </div>
      </header>
      <div id="bg" class="done"><i></i></div>
      <div id="stage"></div>
      <div id="msg" class="hide">
        <div id="mtxt"></div>
        <div id="prog"><i></i></div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <script>
      /* ===== EDIT THIS PART ===== */
      // Google Cloud API key with "Google Drive API" enabled.
      const DRIVE_API_KEY = "AIzaSyBAfeEO3OWZqrnGMqoYO5r9cPPcT5CLZSg";
      // Published CSV link of your Google Sheet (Share → Publish to web → pick the tab → CSV).
      // Sheet columns (row 1 = headers): category, title, sub, author, color, driveId, pdf, cover
      const SHEET_CSV_URL =
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vTREzHC7NabWD51Mn0I_6_uZpdd-LnaCFCfl7XWJxcwpTDrrCFJF33iVedZBcGrx1f6HO97IMucQ1bw/pub?gid=0&single=true&output=csv";
      /* ========================== */

      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const $ = (id) => document.getElementById(id);
      let BOOKS = [],
        flip = null,
        token = 0,
        pages = [],
        pageEls = [],
        ratio = 0.7,
        zoom = 1,
        cur = 0;
      const ZOOMS = [1, 1.5, 2, 3],
        PAD = 8;

      /* ---------- shelves ---------- */
      function parseCSV(text) {
        const rows = [];
        let row = [],
          cell = "",
          q = false;
        for (let i = 0; i < text.length; i++) {
          const c = text[i];
          if (q) {
            if (c === '"') {
              if (text[i + 1] === '"') {
                cell += '"';
                i++;
              } else q = false;
            } else cell += c;
          } else if (c === '"') q = true;
          else if (c === ",") {
            row.push(cell);
            cell = "";
          } else if (c === "\n" || c === "\r") {
            if (c === "\r" && text[i + 1] === "\n") i++;
            row.push(cell);
            rows.push(row);
            row = [];
            cell = "";
          } else cell += c;
        }
        if (cell || row.length) {
          row.push(cell);
          rows.push(row);
        }
        return rows;
      }
      const PALETTE = [
        "#e8892b",
        "#d95d4f",
        "#2a9d9f",
        "#d63a5c",
        "#8e5cb8",
        "#2fa58b",
        "#4f6bd6",
        "#6aa832",
      ];
      const driveThumb = (id) =>
        `https://drive.google.com/thumbnail?id=${id}&sz=w500`;
      // cover: a Drive link/ID or image URL; if empty, the Drive thumbnail of the PDF's first page is used
      function coverUrl(o) {
        const c = o.cover,
          m = c && c.match(/[-\w]{25,}/);
        if (c && m && (/drive\.google\.com/.test(c) || /^[-\w]{25,}$/.test(c)))
          return driveThumb(m[0]);
        if (c) return c;
        return o.driveid ? driveThumb(o.driveid) : "";
      }
      async function loadBooks() {
        $("shelves").innerHTML = `<p class="empty">Loading the library…</p>`;
        try {
          const res = await fetch(SHEET_CSV_URL);
          if (!res.ok) throw new Error(res.status);
          const [head, ...rows] = parseCSV(await res.text());
          const keys = head.map((h) => h.trim().toLowerCase());
          BOOKS = rows
            .filter((r) => r.some((c) => c.trim()))
            .map((r) => {
              const o = {};
              keys.forEach((k, i) => (o[k] = (r[i] || "").trim()));
              return {
                category: o.category || "Library",
                title: o.title || "Magazine",
                sub: o.sub || "",
                author: o.author || "",
                color: o.color || "#a23b4a",
                driveId: o.driveid,
                pdf: o.pdf,
                cover: coverUrl(o),
              };
            });
          renderShelves();
        } catch (err) {
          console.error(err);
          $("shelves").innerHTML =
            `<p class="empty">Couldn't load the library. Please try again later.</p>`;
        }
      }
      /* ---------- 2-hour cache (Cache Storage) ---------- */
      const TTL = 2 * 60 * 60 * 1000,
        CACHE = "magazine-v1";
      async function cacheGet(key) {
        try {
          const c = await caches.open(CACHE),
            r = await c.match(key);
          if (!r) return null;
          if (Date.now() - (+r.headers.get("x-cached-at") || 0) > TTL) {
            c.delete(key);
            return null;
          }
          return await r.blob();
        } catch (e) {
          return null;
        }
      }
      async function cachePut(key, blob) {
        try {
          const c = await caches.open(CACHE);
          await c.put(
            key,
            new Response(blob, {
              headers: {
                "x-cached-at": String(Date.now()),
                "content-type": blob.type || "image/jpeg",
              },
            }),
          );
        } catch (e) {}
      }
      const metaKey = (id, w) => `mag:${id}:${w}`;
      function readMeta(k) {
        try {
          const m = JSON.parse(localStorage.getItem(k));
          return m && Date.now() - m.t < TTL ? m : null;
        } catch (e) {
          return null;
        }
      }
      function writeMeta(k, m) {
        try {
          localStorage.setItem(k, JSON.stringify({ ...m, t: Date.now() }));
        } catch (e) {}
      }
      const pageKey = (id, w, i) =>
        `https://cache.local/p/${encodeURIComponent(id)}/${w}/${i}`;

      const coverURLs = new Map(); // cover url -> object url (reused across re-renders)
      async function loadCover(im, url) {
        if (coverURLs.has(url)) {
          im.src = coverURLs.get(url);
          return;
        }
        let blob = await cacheGet(url);
        if (!blob) {
          try {
            const res = await fetch(url, { mode: "cors" });
            if (!res.ok) throw new Error(res.status);
            blob = await res.blob();
            if (!blob.type.startsWith("image/"))
              throw new Error("not an image");
            cachePut(url, blob);
          } catch (e) {
            im.src = url;
            return;
          } // CORS blocked: plain <img>, browser cache applies
        }
        const u = URL.createObjectURL(blob);
        coverURLs.set(url, u);
        im.src = u;
      }
      const io = new IntersectionObserver(
        (es) =>
          es.forEach((e) => {
            if (e.isIntersecting) {
              io.unobserve(e.target);
              e.target._load();
            }
          }),
        { rootMargin: "300px" },
      );

      function makeCard(b) {
        const el = document.createElement("button");
        el.className = "card";
        el.setAttribute("aria-label", `${b.title}, ${b.sub}`);
        el.innerHTML = `<span class="b3d"><span class="pages"></span><span class="cover"><span class="ph"><b></b><span></span></span></span></span><span class="ct"></span><span class="cs"></span>`;
        const cv = el.querySelector(".cover");
        cv.style.setProperty("--c", b.color);
        el.querySelector(".ph b").textContent = b.title;
        el.querySelector(".ph span").textContent = b.sub;
        el.querySelector(".ct").textContent = b.title;
        el.querySelector(".cs").textContent = [b.sub, b.author]
          .filter(Boolean)
          .join(" · ");
        if (b.cover) {
          cv._load = () => {
            const im = new Image();
            im.alt = "";
            im.referrerPolicy = "no-referrer";
            im.onerror = () => im.remove();
            cv.appendChild(im);
            loadCover(im, b.cover);
          };
          io.observe(cv); // fetch the cover only when it is near the screen
        }
        el.onclick = () => openBook(b);
        return el;
      }
      const ARROW = (d) =>
        `<svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="${d}"/></svg>`;
      function makeCarousel(nodes) {
        const car = document.createElement("div");
        car.className = "car";
        car.innerHTML = `<div class="track"></div>
    <button class="nav prev" aria-label="Previous">${ARROW("M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z")}</button>
    <button class="nav next" aria-label="Next">${ARROW("M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z")}</button>`;
        const track = car.querySelector(".track"),
          prev = car.querySelector(".prev"),
          next = car.querySelector(".next");
        nodes.forEach((n) => track.appendChild(n));
        car._upd = () => {
          prev.hidden = track.scrollLeft <= 2;
          next.hidden =
            track.scrollLeft + track.clientWidth >= track.scrollWidth - 2;
        };
        prev.onclick = () =>
          track.scrollBy({
            left: -track.clientWidth * 0.9,
            behavior: "smooth",
          });
        next.onclick = () =>
          track.scrollBy({ left: track.clientWidth * 0.9, behavior: "smooth" });
        track.addEventListener("scroll", car._upd, { passive: true });
        return car;
      }
      function renderShelves() {
        const s = $("q").value.trim().toLowerCase();
        const list = BOOKS.filter((b) =>
          `${b.title} ${b.sub} ${b.author} ${b.category}`
            .toLowerCase()
            .includes(s),
        );
        const all = [...new Set(BOOKS.map((b) => b.category))];
        const groups = new Map();
        list.forEach((b) => {
          if (!groups.has(b.category)) groups.set(b.category, []);
          groups.get(b.category).push(b);
        });
        const root = $("shelves");
        root.innerHTML = "";
        if (!groups.size) {
          root.innerHTML = `<p class="empty">No books found.</p>`;
          return;
        }
        if (!s && all.length > 1) {
          const g = document.createElement("section");
          g.className = "genres";
          g.innerHTML = `<div class="cat-h"><h2>Books by Genre</h2></div>`;
          const tiles = all.map((name, i) => {
            const t = document.createElement("button");
            t.className = "tile";
            t.innerHTML = `<span class="ti"></span><span class="tn"></span><span class="tc">Books: <b></b></span>`;
            t.querySelector(".ti").style.background =
              PALETTE[i % PALETTE.length];
            t.querySelector(".ti").textContent = [...name][0].toUpperCase();
            t.querySelector(".tn").textContent = name;
            t.querySelector("b").textContent = BOOKS.filter(
              (b) => b.category === name,
            ).length;
            t.onclick = () =>
              document
                .getElementById("cat-" + i)
                .scrollIntoView({ behavior: "smooth", block: "start" });
            return t;
          });
          g.appendChild(makeCarousel(tiles));
          root.appendChild(g);
        }
        groups.forEach((books, name) => {
          const sec = document.createElement("section");
          sec.className = "cat";
          sec.id = "cat-" + all.indexOf(name);
          if (s) sec.dataset.open = "1"; // while searching, show every match
          sec.innerHTML = `<div class="cat-h"><h2></h2><button class="va">View All</button></div>`;
          sec.querySelector("h2").textContent = name;
          sec.appendChild(makeCarousel(books.map(makeCard)));
          sec.querySelector(".va").onclick = () => {
            sec.dataset.open = sec.dataset.open === "1" ? "" : "1";
            updateCarousels();
          };
          root.appendChild(sec);
        });
        updateCarousels();
      }
      // "View All" only appears when a row overflows; it turns the carousel into a full grid
      function updateCarousels() {
        const searching = !!$("q").value.trim();
        document.querySelectorAll(".cat").forEach((sec) => {
          const track = sec.querySelector(".track"),
            btn = sec.querySelector(".va"),
            open = sec.dataset.open === "1";
          btn.textContent = open ? "Show less" : "View All";
          btn.hidden =
            searching || (!open && track.scrollWidth <= track.clientWidth + 2);
        });
        document.querySelectorAll(".car").forEach((c) => c._upd());
      }
      $("q").oninput = renderShelves;

      /* ---------- reader ---------- */
      function showMsg(text, pct) {
        $("msg").classList.remove("hide");
        $("mtxt").textContent = text;
        $("prog").style.display = pct == null ? "none" : "block";
        if (pct != null) $("prog").firstElementChild.style.width = pct + "%";
      }
      function destroyFlip() {
        if (flip) {
          try {
            flip.destroy();
          } catch (e) {}
          flip = null;
        }
        $("stage").innerHTML = "";
      }
      function freePages() {
        pages.forEach((u) => u && URL.revokeObjectURL(u));
        pages = [];
        pageEls = [];
      }

      // width of one page when the whole book fits the stage exactly (no scrollbars)
      function fitWidth() {
        const st = $("stage"),
          W = st.clientWidth - PAD,
          H = st.clientHeight - PAD;
        return Math.min(W < 720 ? W : W / 2, H * ratio);
      }
      function fill(d, i) {
        // image, spinner (still rendering) or error text
        d.innerHTML = "";
        if (pages[i]) {
          const im = new Image();
          im.src = pages[i];
          im.alt = `Page ${i + 1}`;
          im.draggable = false;
          d.appendChild(im);
          return;
        }
        const s = document.createElement("span");
        s.className = pages[i] === null ? "spin" : "fail";
        if (pages[i] === "") s.textContent = "Couldn't load this page";
        d.appendChild(s);
      }
      function build(start) {
        destroyFlip();
        const st = $("stage"),
          portrait = st.clientWidth - PAD < 720,
          n = pages.length;
        const pw = Math.floor(fitWidth() * zoom),
          ph = Math.floor(pw / ratio);
        st.classList.toggle("zoomed", zoom > 1);
        const host = document.createElement("div");
        host.className = "flip";
        host.style.cssText = `width:${portrait ? pw : pw * 2}px;height:${ph}px`;
        st.appendChild(host);
        pageEls = [];
        for (let i = 0; i < n; i++) {
          const d = document.createElement("div");
          d.className = "page";
          if (i === 0 || i === n - 1) d.dataset.density = "hard";
          fill(d, i);
          host.appendChild(d);
          pageEls.push(d);
        }
        flip = new St.PageFlip(host, {
          width: pw,
          height: ph,
          size: "stretch",
          minWidth: pw * 0.9,
          maxWidth: pw * 1.5,
          minHeight: ph * 0.5,
          maxHeight: ph * 1.5,
          showCover: true,
          maxShadowOpacity: 0.5,
          usePortrait: true,
          mobileScrollSupport: true,
          useMouseEvents: zoom === 1, // when zoomed, swiping/dragging scrolls instead of flipping
        });
        flip.loadFromHTML(host.querySelectorAll(".page"));
        if (start > 0) flip.turnToPage(start);
        flip.on("flip", (e) => {
          cur = e.data;
          updateUI();
        });
        updateUI();
      }
      function updateUI() {
        if (!flip) return;
        cur = Math.min(flip.getCurrentPageIndex(), pages.length - 1);
        $("seek").value = cur + 1;
        $("goto").value = cur + 1;
        $("prev").disabled = cur <= 0;
        $("next").disabled = cur >= pages.length - 1;
        $("zval").textContent = Math.round(zoom * 100) + "%";
        $("zout").disabled = zoom <= ZOOMS[0];
        $("zin").disabled = zoom >= ZOOMS[ZOOMS.length - 1];
      }
      function goTo(n) {
        if (!flip) return;
        n = Math.max(1, Math.min(pages.length, parseInt(n, 10) || 1));
        flip.turnToPage(n - 1);
        updateUI();
      }
      function setZoom(z) {
        zoom = z;
        build(cur);
      }

      async function openBook(b) {
        const my = ++token;
        destroyFlip();
        freePages();
        zoom = 1;
        cur = 0;
        document.documentElement.classList.add("lock");
        $("reader").classList.remove("ready");
        $("reader").classList.add("on");
        $("rtitle").textContent = `${b.title} — ${b.sub}`;
        $("bg").classList.add("done");
        $("bg").firstElementChild.style.width = "0";
        showMsg("Opening the issue…", 0);

        const id = b.driveId || b.pdf;
        const url =
          b.pdf ||
          `https://www.googleapis.com/drive/v3/files/${b.driveId}?alt=media&key=${DRIVE_API_KEY}`;
        // render size: sharp on retina screens and at 300% zoom; bucketed so cached pages are reused
        const dpr = Math.min(window.devicePixelRatio || 1, 3),
          cap = innerWidth < 720 ? 1800 : 2400;
        const stW = $("stage").clientWidth - PAD;
        const target =
          Math.round(
            Math.min(
              cap,
              Math.max(1400, (stW < 720 ? stW : stW / 2) * dpr * 2.5),
            ) / 200,
          ) * 200;
        const mk = metaKey(id, target);
        let revealed = false,
          pdfP = null;
        const getPdf = () =>
          pdfP ||
          (pdfP = (() => {
            // the PDF is only downloaded if some page isn't cached
            const task = pdfjsLib.getDocument({ url });
            task.onProgress = (p) => {
              if (!revealed && my === token && p.total)
                showMsg("Downloading the issue…", (p.loaded / p.total) * 100);
            };
            return task.promise;
          })());
        try {
          let meta = readMeta(mk);
          if (!meta) {
            const pdf = await getPdf();
            if (my !== token) return;
            const v0 = (await pdf.getPage(1)).getViewport({ scale: 1 });
            meta = { n: pdf.numPages, ratio: v0.width / v0.height };
            writeMeta(mk, meta);
          }
          ratio = meta.ratio;
          pages = new Array(meta.n).fill(null);
          $("seek").max = meta.n;
          $("goto").max = meta.n;
          $("total").textContent = meta.n;
          const K = Math.min(2, meta.n);
          let done = 0;
          // next page to render: closest to where the reader is (slightly favouring forward)
          const next = () => {
            let best = -1,
              bd = Infinity;
            for (let i = 0; i < pages.length; i++)
              if (pages[i] === null) {
                const d = i >= cur ? i - cur : (cur - i) * 1.5;
                if (d < bd) {
                  bd = d;
                  best = i;
                }
              }
            return best;
          };
          for (;;) {
            const i = next();
            if (i < 0) break;
            let blob = null;
            try {
              blob = await cacheGet(pageKey(id, target, i));
              if (!blob) {
                const pdf = await getPdf();
                if (my !== token) return;
                const page = await pdf.getPage(i + 1);
                const vp = page.getViewport({
                  scale: target / page.getViewport({ scale: 1 }).width,
                });
                const c = document.createElement("canvas");
                c.width = vp.width;
                c.height = vp.height;
                await page.render({
                  canvasContext: c.getContext("2d"),
                  viewport: vp,
                }).promise;
                blob = await new Promise((r) =>
                  c.toBlob(r, "image/jpeg", 0.92),
                );
                c.width = c.height = 0;
                cachePut(pageKey(id, target, i), blob);
              }
            } catch (e) {
              console.error(e);
              if (!revealed) throw e; // nothing to show yet: report the error
              if (my !== token) return;
              pages[i] = "";
              showPage(i);
              continue;
            }
            if (my !== token) return;
            pages[i] = URL.createObjectURL(blob);
            done++;
            if (revealed) showPage(i);
            else if (done >= K) {
              // first pages are ready: open the book now
              revealed = true;
              $("msg").classList.add("hide");
              $("reader").classList.add("ready");
              build(cur);
            } else showMsg(`Loading page ${done} of ${K}`, (done / K) * 100);
            $("bg").classList.toggle("done", done >= meta.n); // thin bar = background loading of the rest
            $("bg").firstElementChild.style.width = (done / meta.n) * 100 + "%";
          }
        } catch (err) {
          console.error(err);
          if (my === token) {
            destroyFlip();
            showMsg("Couldn't load this issue. Please try again later.");
          }
        }
      }
      function showPage(i) {
        if (pageEls[i]) fill(pageEls[i], i);
      }
      function closeReader() {
        token++;
        destroyFlip();
        freePages();
        $("reader").classList.remove("on", "ready");
        document.documentElement.classList.remove("lock");
      }

      $("close").onclick = closeReader;
      $("prev").onclick = () => flip && flip.flipPrev();
      $("next").onclick = () => flip && flip.flipNext();
      $("zin").onclick = () =>
        setZoom(ZOOMS[Math.min(ZOOMS.indexOf(zoom) + 1, ZOOMS.length - 1)]);
      $("zout").onclick = () =>
        setZoom(ZOOMS[Math.max(ZOOMS.indexOf(zoom) - 1, 0)]);
      $("zval").onclick = () => setZoom(1);
      $("gobtn").onclick = () => goTo($("goto").value);
      $("goto").onkeydown = (e) => {
        if (e.key === "Enter") goTo(e.target.value);
      };
      $("seek").oninput = (e) => {
        $("goto").value = e.target.value;
      };
      $("seek").onchange = (e) => goTo(e.target.value);

      // mouse drag to pan when zoomed (touch uses native scrolling)
      let drag = null;
      const stage = $("stage");
      stage.addEventListener("pointerdown", (e) => {
        if (zoom <= 1 || e.pointerType !== "mouse" || e.button !== 0) return;
        drag = {
          x: e.clientX,
          y: e.clientY,
          l: stage.scrollLeft,
          t: stage.scrollTop,
        };
        stage.setPointerCapture(e.pointerId);
        stage.classList.add("grabbing");
      });
      stage.addEventListener("pointermove", (e) => {
        if (!drag) return;
        stage.scrollLeft = drag.l - (e.clientX - drag.x);
        stage.scrollTop = drag.t - (e.clientY - drag.y);
      });
      ["pointerup", "pointercancel"].forEach((t) =>
        stage.addEventListener(t, () => {
          drag = null;
          stage.classList.remove("grabbing");
        }),
      );

      addEventListener("keydown", (e) => {
        if (!$("reader").classList.contains("on")) return;
        if (e.key === "Escape") return closeReader();
        if (e.target.tagName === "INPUT") return;
        if (e.key === "ArrowLeft" && flip) flip.flipPrev();
        if (e.key === "ArrowRight" && flip) flip.flipNext();
        if ((e.key === "+" || e.key === "=") && !$("zin").disabled)
          $("zin").click();
        if (e.key === "-" && !$("zout").disabled) $("zout").click();
      });
      let rz;
      addEventListener("resize", () => {
        clearTimeout(rz);
        rz = setTimeout(() => {
          if (flip && pages.length) build(cur);
        }, 250);
      });
      addEventListener("resize", updateCarousels);
      addEventListener(
        "scroll",
        () => {
          $("top").hidden = scrollY < 400;
        },
        { passive: true },
      );
      $("top").onclick = () => scrollTo({ top: 0, behavior: "smooth" });
      loadBooks();
    </script>
  </body>
</html>
