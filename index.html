<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Magazine</title>
    <meta property="og:site_name" content="Magazine" />
    <meta property="og:title" content="Magazine" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Noto+Sans+Ol+Chiki:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ---------- Material 3 tokens (change --primary to re-theme) ---------- */
      :root {
        --primary: #b85500;
        --on-primary: #fff;
        --pc: #ffdcc2;
        --on-pc: #3a1a00;
        --sc: #ffe9db;
        --on-sc: #4a2a12;
        --bg: #fffbf8;
        --s1: #fbf2ec;
        --s2: #f6ece5;
        --s3: #f0e6df;
        --on: #211a15;
        --onv: #52443c;
        --outline: #85736a;
        --ov: #d7c3b8;
        --track: #ead9cc;
        --e1: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 3px 1px rgba(0, 0, 0, 0.15);
        --e2: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 6px 2px rgba(0, 0, 0, 0.15);
        --e3: 0 1px 3px rgba(0, 0, 0, 0.3), 0 4px 8px 3px rgba(0, 0, 0, 0.15);
        --gap: 36px;
        --n: 6;
      }
      @media (max-width: 1499px) {
        :root {
          --n: 5;
        }
      }
      @media (max-width: 1199px) {
        :root {
          --n: 4;
        }
      }
      @media (max-width: 899px) {
        :root {
          --n: 3;
          --gap: 24px;
        }
      }
      @media (max-width: 599px) {
        :root {
          --n: 2.3;
          --gap: 14px;
        }
        .cat[data-open="1"] {
          --n: 2;
        }
      }
      * {
        box-sizing: border-box;
      }
      html.lock,
      html.lock body {
        overflow: hidden;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--on);
        font:
          400 16px/1.5 Roboto,
          "Noto Sans Ol Chiki",
          system-ui,
          sans-serif;
      }
      svg {
        display: block;
        fill: currentColor;
      }
      .i {
        width: 24px;
        height: 24px;
      }
      [hidden] {
        display: none !important;
      }
      button {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      /* buttons */
      .ibtn {
        position: relative;
        flex: none;
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 50%;
        background: none;
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      .ibtn:hover:not(:disabled) {
        background: color-mix(in srgb, currentColor 8%, transparent);
      }
      .ibtn:disabled {
        opacity: 0.38;
        cursor: default;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 40px;
        padding: 0 24px;
        border: 0;
        border-radius: 20px;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.1px;
        cursor: pointer;
        transition:
          box-shadow 0.15s,
          filter 0.15s;
      }
      .btn .i {
        width: 18px;
        height: 18px;
      }
      .btn.filled {
        background: var(--primary);
        color: var(--on-primary);
      }
      .btn.tonal {
        background: var(--sc);
        color: var(--on-sc);
      }
      .btn.text {
        background: none;
        color: var(--primary);
        padding: 0 12px;
      }
      .btn:hover {
        filter: brightness(1.06);
        box-shadow: var(--e1);
      }
      .btn.text:hover {
        box-shadow: none;
        background: color-mix(in srgb, var(--primary) 8%, transparent);
      }

      /* progress indicators */
      .linear {
        position: relative;
        height: 4px;
        border-radius: 2px;
        background: var(--track);
        overflow: hidden;
      }
      .linear i {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        border-radius: 2px;
        background: var(--primary);
        transition: width 0.25s cubic-bezier(0.2, 0, 0, 1);
      }
      .linear.ind i {
        width: 35%;
        animation: ind 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes ind {
        0% {
          left: -35%;
        }
        100% {
          left: 100%;
        }
      }
      .circ {
        width: 40px;
        height: 40px;
        animation: rot 1.4s linear infinite;
      }
      .circ circle {
        fill: none;
        stroke: var(--primary);
        stroke-width: 4;
        stroke-linecap: round;
        animation: dash 1.4s ease-in-out infinite;
      }
      @keyframes rot {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes dash {
        0% {
          stroke-dasharray: 1 200;
          stroke-dashoffset: 0;
        }
        50% {
          stroke-dasharray: 90 200;
          stroke-dashoffset: -35;
        }
        100% {
          stroke-dasharray: 90 200;
          stroke-dashoffset: -125;
        }
      }

      /* top app bar + search */
      .appbar {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--bg);
        padding: 12px clamp(16px, 5.2vw, 100px);
        box-shadow: 0 1px 0 var(--ov);
      }
      .top {
        display: flex;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
      }
      .brand {
        font-size: 22px;
        font-weight: 500;
        font-family: "Noto Sans Ol Chiki", Roboto, sans-serif;
      }
      .search {
        flex: 1;
        min-width: 200px;
        max-width: 720px;
        height: 56px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 20px;
        border-radius: 28px;
        background: var(--s3);
        color: var(--onv);
        transition:
          background 0.2s,
          box-shadow 0.2s;
      }
      .search:focus-within {
        background: var(--s2);
        box-shadow: var(--e2);
      }
      #q {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        background: none;
        font-size: 16px;
        color: var(--on);
      }
      .appbar .linear {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        border-radius: 0;
        background: transparent;
      }

      /* sections + carousel */
      main {
        padding: 8px clamp(16px, 5.2vw, 100px) 72px;
        max-width: 1920px;
        margin: 0 auto;
      }
      .cat,
      .genres {
        margin-top: 28px;
      }
      .cat {
        scroll-margin-top: 84px;
      }
      .cat-h {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 12px;
      }
      .cat-h h2 {
        margin: 0;
        font-size: clamp(22px, 2.2vw, 28px);
        font-weight: 400;
      }
      .cat-h h2 i {
        color: var(--primary);
        font-size: 0.8em;
        margin-right: 6px;
      }
      .ti.sm {
        display: inline-grid;
        width: 30px;
        height: 30px;
        border-radius: 9px;
        background: var(--primary);
        vertical-align: -0.2em;
        margin-right: 8px;
        font-size: 16px;
      }
      .iglyph {
        width: 62%;
        height: 62%;
        object-fit: contain;
        filter: grayscale(1) invert(1) contrast(1.4);
        mix-blend-mode: screen;
      }
      .cat-h .btn {
        margin-left: auto;
      }
      .car {
        position: relative;
      }
      .track {
        display: flex;
        gap: var(--gap);
        overflow-x: auto;
        padding: 14px 20px 20px;
        margin: 0 -20px;
        scroll-snap-type: x proximity;
        scroll-padding-inline: 20px;
        scrollbar-width: none;
      }
      .track::-webkit-scrollbar {
        display: none;
      }
      .track > .card {
        flex: 0 0 calc((100% - (var(--n) - 1) * var(--gap)) / var(--n));
        scroll-snap-align: start;
      }
      .track > .tile {
        flex: 0 0 clamp(140px, 12vw, 190px);
        scroll-snap-align: start;
      }
      .genres .track {
        --gap: 14px;
      }
      .cat[data-open="1"] .track {
        flex-wrap: wrap;
        overflow: visible;
        row-gap: 28px;
        scroll-snap-type: none;
      }
      .nav {
        position: absolute;
        top: 38%;
        transform: translateY(-50%);
        z-index: 2;
        width: 48px;
        height: 48px;
        background: var(--s3);
        color: var(--on);
        box-shadow: var(--e2);
      }
      .nav:hover:not(:disabled) {
        background: var(--s2);
      }
      .genres .nav {
        top: 50%;
      }
      .nav.prev {
        left: -8px;
      }
      .nav.next {
        right: -8px;
      }
      .cat[data-open="1"] .nav {
        display: none;
      }
      @media (hover: none) {
        .nav {
          display: none;
        }
      }
      .fab {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 6;
        width: 56px;
        height: 56px;
        border: 0;
        border-radius: 16px;
        background: var(--pc);
        color: var(--on-pc);
        display: grid;
        place-items: center;
        cursor: pointer;
        box-shadow: var(--e3);
      }
      .fab:hover {
        filter: brightness(0.97);
      }

      /* genre tiles */
      .tile {
        all: unset;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 14px 12px;
        background: var(--s1);
        border: 1px solid var(--ov);
        border-radius: 16px;
        cursor: pointer;
        text-align: center;
        min-width: 0;
        transition:
          background 0.15s,
          box-shadow 0.15s;
      }
      .tile:hover {
        background: var(--s2);
        box-shadow: var(--e1);
      }
      .tile:focus-visible,
      .card:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
      .ti {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 22px;
        font-weight: 700;
        font-family: "Noto Sans Ol Chiki", Roboto, sans-serif;
      }
      .glyph {
        display: block;
        width: 100%;
        height: 100%;
        background: currentColor;
        -webkit-mask: var(--g) center/contain no-repeat;
        mask: var(--g) center/contain no-repeat;
      }
      .ti .glyph {
        width: 62%;
        height: 62%;
      }
      .tn {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: clamp(14px, 1vw, 16px);
        font-weight: 500;
      }
      .tc {
        color: var(--onv);
        font-size: clamp(12px, 0.9vw, 14px);
      }
      .tc b {
        color: var(--primary);
        font-weight: 500;
      }

      /* book cards + opening-book hover */
      .card {
        all: unset;
        box-sizing: border-box;
        position: relative;
        isolation: isolate;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        cursor: pointer;
        min-width: 0;
        transition: transform 0.2s;
      }
      .card::before {
        content: "";
        position: absolute;
        inset: -14px -16px -12px;
        z-index: -1;
        border-radius: 16px;
        background: var(--s2);
        box-shadow: var(--e1);
        opacity: 0;
        transition: opacity 0.18s;
      }
      .b3d {
        display: block;
        position: relative;
        width: 100%;
        aspect-ratio: 2/3;
        perspective: 900px;
        margin-bottom: 16px;
      }
      .pages {
        position: absolute;
        inset: 1.5% 0;
        border-radius: 0 3px 3px 0;
        background: linear-gradient(90deg, #f1ebe0, #fff);
        opacity: 0;
        transition: opacity 0.2s;
        box-shadow:
          3px 0 0 #fff,
          4px 0 0 #cfc8bb,
          7px 0 0 #fff,
          8px 0 0 #cfc8bb,
          11px 0 0 #fff,
          12px 0 0 #bdb5a6;
      }
      .cover {
        position: absolute;
        inset: 0;
        border-radius: 4px 8px 8px 4px;
        background: var(--c, #a23b4a);
        overflow: hidden;
        box-shadow: 2px 3px 8px rgba(0, 0, 0, 0.3);
        transform-origin: left center;
        transition:
          transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1),
          box-shadow 0.35s;
      }
      .cover::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.35) 0,
          rgba(0, 0, 0, 0.18) 3%,
          transparent 7%
        );
      }
      .cover img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .ph {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px;
        color: #fff;
        font-family: "Noto Sans Ol Chiki", Roboto, sans-serif;
      }
      .ph b {
        font-size: 22px;
      }
      .ph span {
        font-size: 12px;
        font-family: Roboto, sans-serif;
      }
      .card:focus-visible::before {
        opacity: 1;
      }
      @media (hover: hover) {
        .card:hover {
          transform: translateY(-3px);
        }
        .card:hover::before {
          opacity: 1;
        }
        .card:hover .pages {
          opacity: 1;
        }
        .card:hover .cover {
          transform: rotateY(-24deg);
          box-shadow: 10px 6px 16px rgba(0, 0, 0, 0.35);
        }
      }
      .ct,
      .cs {
        display: block;
        width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ct {
        font-size: clamp(15px, 1.05vw, 17px);
        font-weight: 500;
      }
      .cs {
        margin-top: 4px;
        font-size: clamp(13px, 0.95vw, 15px);
        color: var(--onv);
      }
      .empty {
        margin: 48px 0;
        text-align: center;
        color: var(--onv);
      }

      /* details dialog */
      .scrim {
        position: fixed;
        inset: 0;
        z-index: 8;
        display: grid;
        place-items: center;
        padding: 16px;
        background: rgba(33, 26, 21, 0.42);
        animation: fade 0.18s;
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.94);
        }
      }
      .dialog {
        position: relative;
        width: min(780px, 100%);
        max-height: calc(100dvh - 32px);
        overflow: auto;
        padding: 28px;
        border-radius: 28px;
        background: var(--bg);
        box-shadow: var(--e3);
        animation: pop 0.22s cubic-bezier(0.2, 0, 0, 1);
      }
      .dialog .x {
        position: absolute;
        top: 12px;
        right: 12px;
      }
      .d-main {
        display: flex;
        gap: 28px;
        flex-wrap: wrap;
        align-items: flex-start;
      }
      .d-cover {
        width: min(200px, 60%);
        flex: none;
        margin: 0 auto;
      }
      .d-cover .b3d {
        margin: 0;
      }
      .d-info {
        flex: 1;
        min-width: 260px;
      }
      .d-info h2 {
        margin: 0 40px 14px 0;
        font-size: 28px;
        line-height: 1.25;
        font-weight: 400;
      }
      .d-rows {
        border: 1px solid var(--ov);
        border-radius: 12px;
        overflow: hidden;
      }
      .d-row {
        display: grid;
        grid-template-columns: 28px 110px 1fr;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        font-size: 14px;
      }
      .d-row + .d-row {
        border-top: 1px solid var(--ov);
      }
      .d-row i {
        color: var(--primary);
        text-align: center;
      }
      .d-row .dl {
        color: var(--onv);
      }
      .d-row .dv {
        font-weight: 500;
      }
      .d-actions {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin-top: 18px;
      }
      #dsumwrap h3 {
        margin: 26px 0 6px;
        font-size: 20px;
        font-weight: 500;
      }
      #dsum {
        margin: 0;
        color: var(--onv);
        white-space: pre-line;
      }
      #snack {
        position: fixed;
        left: 50%;
        bottom: 24px;
        z-index: 20;
        max-width: 90vw;
        padding: 14px 16px;
        border-radius: 4px;
        background: #362f2b;
        color: #fbeee7;
        font-size: 14px;
        box-shadow: var(--e3);
        transform: translate(-50%, 90px);
        opacity: 0;
        pointer-events: none;
        transition:
          transform 0.25s,
          opacity 0.25s;
      }
      #snack.on {
        transform: translate(-50%, 0);
        opacity: 1;
      }

      /* reader (dark Material surface) */
      #reader {
        --primary: #ffb68a;
        --on-primary: #4e2400;
        --pc: #6e3000;
        --on-pc: #ffdcc2;
        --sc: #5a4234;
        --on-sc: #ffe9db;
        --bg: #17120e;
        --s1: #1f1914;
        --s2: #2a231d;
        --s3: #352d26;
        --on: #ebe0d8;
        --onv: #d7c3b8;
        --outline: #9f8d83;
        --ov: #52443c;
        --track: #4a3f37;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 100dvh;
        background: var(--bg);
        color: var(--on);
        display: none;
        flex-direction: column;
        z-index: 10;
      }
      #reader.on {
        display: flex;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 6px 12px;
        background: var(--s1);
      }
      .titlebar {
        display: flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
        flex: 0 1 340px;
      }
      .t {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 18px;
      }
      .tools {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        visibility: hidden;
      }
      #reader.ready .tools {
        visibility: visible;
      }
      .go {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        white-space: nowrap;
        color: var(--onv);
      }
      #goto {
        width: 56px;
        height: 36px;
        border: 1px solid var(--outline);
        border-radius: 8px;
        background: none;
        color: var(--on);
        font: inherit;
        text-align: center;
      }
      #goto:focus {
        outline: 0;
        border: 2px solid var(--primary);
      }
      .zoom {
        display: flex;
        align-items: center;
      }
      #zval {
        min-width: 64px;
        height: 36px;
        padding: 0 10px;
        border: 0;
        border-radius: 18px;
        background: none;
        color: var(--primary);
        font-weight: 500;
        cursor: pointer;
      }
      #zval:hover {
        background: color-mix(in srgb, var(--primary) 8%, transparent);
      }
      #seek {
        flex: 1;
        min-width: 60px;
        height: 24px;
        margin: 0 8px;
        background: transparent;
        -webkit-appearance: none;
        appearance: none;
        --p: 0%;
        cursor: pointer;
      }
      #seek::-webkit-slider-runnable-track {
        height: 4px;
        border-radius: 2px;
        background: linear-gradient(
          90deg,
          var(--primary) var(--p),
          var(--track) var(--p)
        );
      }
      #seek::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        margin-top: -8px;
        border-radius: 50%;
        background: var(--primary);
        box-shadow: 0 0 0 0 color-mix(in srgb, var(--primary) 20%, transparent);
        transition: box-shadow 0.15s;
      }
      #seek:hover::-webkit-slider-thumb,
      #seek:active::-webkit-slider-thumb {
        box-shadow: 0 0 0 8px
          color-mix(in srgb, var(--primary) 20%, transparent);
      }
      #seek::-moz-range-track {
        height: 4px;
        border-radius: 2px;
        background: var(--track);
      }
      #seek::-moz-range-progress {
        height: 4px;
        border-radius: 2px;
        background: var(--primary);
      }
      #seek::-moz-range-thumb {
        width: 20px;
        height: 20px;
        border: 0;
        border-radius: 50%;
        background: var(--primary);
      }
      #seek:focus-visible {
        outline: 0;
      }
      #bg {
        flex: none;
        border-radius: 0;
        background: var(--s2);
      }
      #bg.done {
        visibility: hidden;
      }
      #stage {
        flex: 1;
        min-height: 0;
        display: flex;
        overflow: hidden;
        padding: 4px;
      }
      #stage.zoomed {
        overflow: auto;
        scrollbar-width: thin;
        cursor: grab;
      }
      #stage.zoomed.grabbing {
        cursor: grabbing;
      }
      #stage.zoomed * {
        touch-action: pan-x pan-y pinch-zoom !important;
      }
      .flip {
        margin: auto;

    <script>
      /* ===== EDIT THIS PART ===== */
      // Google Cloud API key with "Google Drive API" enabled. Works ONLY for files shared as "Anyone with the link".
      const DRIVE_API_KEY = "AIzaSyBAfeEO3OWZqrnGMqoYO5r9cPPcT5CLZSg";
      // Published CSV link of your Google Sheet (Share → Publish to web → pick the tab → CSV).

      const SHEET_CSV_URL =

      /* ---------- 2-hour cache (Cache Storage) ---------- */
      const TTL = 2 * 60 * 60 * 1000,
        CACHE = "magazine-v1";
      async function cacheGet(key) {
        try {
          const c = await caches.open(CACHE),
            r = await c.match(key);
          if (!r) return null;
          if (Date.now() - (+r.headers.get("x-cached-at") || 0) > TTL) {
            c.delete(key);
            return null;
          }
          return await r.blob();
        } catch (e) {
          return null;
        }
      }
      async function cachePut(key, blob) {
        try {
          const c = await caches.open(CACHE);
          await c.put(
            key,
            new Response(blob, {
              headers: {
                "x-cached-at": String(Date.now()),
                "content-type": blob.type || "image/jpeg",
              },
            }),
          );
        } catch (e) {}
      }
      const metaKey = (id, w) => `mag:${id}:${w}`;
      function readMeta(k) {
        try {
          const m = JSON.parse(localStorage.getItem(k));
          return m && Date.now() - m.t < TTL ? m : null;
        } catch (e) {
          return null;
        }
      }
      function writeMeta(k, m) {
        try {
          localStorage.setItem(k, JSON.stringify({ ...m, t: Date.now() }));
        } catch (e) {}
      }
      const pageKey = (id, w, i) =>
        `https://cache.local/p/${encodeURIComponent(id)}/${w}/${i}`;

      /* ---------- Drive access: API key (public files) or Apps Script proxy (private files) ---------- */
      const driveThumb = (id, w = 500) =>
        `https://drive.google.com/thumbnail?id=${id}&sz=w${w}`;
      const imgSrc = (id, w) => (PROXY_URL ? `proxy:${id}` : driveThumb(id, w));
      async function proxyBlob(id, kind) {
        const r = await fetch(
          `${PROXY_URL}?id=${encodeURIComponent(id)}&kind=${kind}`,
        );
        const j = await r.json();
        if (j.error) throw new Error(j.error);
        const bin = atob(j.data),
          u8 = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
        return new Blob([u8], { type: j.mime });
      }
      function driveImg(v, w) {
        // Drive link / file ID / image URL -> loadable source
        if (!v) return "";
        const m = v.match(/[-\w]{25,}/);
        if (m && (/drive\.google\.com/.test(v) || /^[-\w]{25,}$/.test(v)))
          return imgSrc(m[0], w);
        return /^https?:|^[\w./-]+\.(png|jpe?g|webp|svg|gif)$/i.test(v)
          ? v
          : ""; // web URL or a file kept in the repo (e.g. icons/quill.png)
      }
      function coverUrl(o) {
        if (o.cover) return driveImg(o.cover, 500) || o.cover;
        return o.driveid ? imgSrc(o.driveid, 500) : "";
      }
      const objURLs = new Map(); // source -> object url (reused across re-renders)
      async function imageSrc(url) {
        // cached object URL, or the raw URL if it can't be fetched
        if (objURLs.has(url)) return objURLs.get(url);
        const px = url.startsWith("proxy:"),
          key = px ? `https://cache.local/c/${url.slice(6)}` : url;
        let blob = await cacheGet(key);
        if (!blob) {
          try {
            if (px) blob = await proxyBlob(url.slice(6), "thumb");
            else {
              const res = await fetch(url, { mode: "cors" });
              if (!res.ok) throw new Error(res.status);
              blob = await res.blob();
              if (!blob.type.startsWith("image/"))
                throw new Error("not an image");
            }
            cachePut(key, blob);
          } catch (e) {
            if (px) throw e;
            return url;
          } // CORS blocked: plain <img>, browser cache applies
        }
        const u = URL.createObjectURL(blob);
        objURLs.set(url, u);
        return u;
      }
      async function loadCover(im, url) {
        try {
          im.src = await imageSrc(url);
        } catch (e) {
          im.remove();
        }
      }
      const io = new IntersectionObserver(
        (es) =>
          es.forEach((e) => {
            if (e.isIntersecting) {
              io.unobserve(e.target);
              e.target._load();
            }
          }),
        { rootMargin: "300px" },
      );

      /* ---------- category icons: Font Awesome first, uploaded image second ---------- */
      const CAT_ICON = {};
      function faClass(v) {
        // "book", "fa-book", "fa-regular fa-star" ...
        const tk = (v || "")
          .toLowerCase()
          .replace(/[^a-z0-9 -]/g, "")
          .split(/\s+/)
          .filter(Boolean);
        if (!tk.length) return "";
        const out = tk.map((x) =>
          /^(fa|fas|far|fab|fal|fat)$/.test(x) || x.startsWith("fa-")
            ? x
            : "fa-" + x,
        );
        if (
          !out.some((x) =>
            /^fa-(solid|regular|brands)$|^(fas|far|fab)$/.test(x),
          )
        )
          out.unshift("fa-solid");
        return out.join(" ");
      }
      function iconFields(o) {
        const iv = o.icon || "",
          isImg =
            /^https?:|drive\.google\.com|\.(png|jpe?g|webp|svg|gif)$/i.test(iv);
        return {
          icon: isImg ? "" : faClass(iv),
          iconImg: driveImg(o.iconimg || (isImg ? iv : ""), 160),
        };
      }
      // Uploaded icons are turned into a one-colour glyph so they look like the Font Awesome ones
      const glyphs = new Map();
      async function glyph(url) {
        if (glyphs.has(url)) return glyphs.get(url);
        const im = new Image();
        im.src = await imageSrc(url);
        await im.decode();
        const k = Math.min(
          1,
          256 / Math.max(im.naturalWidth, im.naturalHeight),
        );
        const c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(im.naturalWidth * k));
        c.height = Math.max(1, Math.round(im.naturalHeight * k));
        const x = c.getContext("2d");
        x.drawImage(im, 0, 0, c.width, c.height);
        const d = x.getImageData(0, 0, c.width, c.height),
          p = d.data;
        let tr = 0;
        for (let i = 3; i < p.length; i += 4) if (p[i] < 250) tr++;
        const byAlpha = tr > (p.length / 4) * 0.03; // transparent PNG: use its shape; opaque image: use its dark strokes
        for (let i = 0; i < p.length; i += 4) {
          const lum =
              (0.2126 * p[i] + 0.7152 * p[i + 1] + 0.0722 * p[i + 2]) / 255,
            a = p[i + 3];
          p[i] = p[i + 1] = p[i + 2] = 255;
          p[i + 3] = Math.round(byAlpha ? a : Math.min(1, (1 - lum) * 1.5) * a);
        }
        x.putImageData(d, 0, 0);
        const out = c.toDataURL("image/png");
        glyphs.set(url, out);
        return out;
      }
      function makeIcon(spec, onfail) {
        if (spec.fa) {
          const i = document.createElement("i");
          i.className = spec.fa;
          return i;
        }
        const s = document.createElement("span");
        s.className = "glyph";
        glyph(spec.img)
          .then((g) => s.style.setProperty("--g", `url(${g})`))
          .catch(async () => {
            try {
              // pixels not readable (cross-origin): show the image itself, blended to look white
              const im = new Image();
              im.className = "iglyph";
              im.alt = "";
              im.onerror = () => {
                im.remove();
                onfail && onfail();
              };
              im.src = await imageSrc(spec.img);
              s.replaceWith(im);
            } catch (e) {
              s.remove();
              onfail && onfail();
            }
          });
        return s;
      }
      function headIcon(spec) {
        // category heading: small coloured tile, same look as the genre tiles
        if (spec.fa) return makeIcon(spec);
        const t = document.createElement("span");
        t.className = "ti sm";
        t.appendChild(makeIcon(spec, () => t.remove()));
        return t;
      }

      /* ---------- library ---------- */
      function parseCSV(text) {
        const rows = [];
        let row = [],
          cell = "",
          q = false;
        for (let i = 0; i < text.length; i++) {
          const c = text[i];
          if (q) {
            if (c === '"') {
              if (text[i + 1] === '"') {
                cell += '"';
                i++;
              } else q = false;
            } else cell += c;
          } else if (c === '"') q = true;
          else if (c === ",") {
            row.push(cell);
            cell = "";
          } else if (c === "\n" || c === "\r") {
            if (c === "\r" && text[i + 1] === "\n") i++;
            row.push(cell);
            rows.push(row);
            row = [];
            cell = "";
          } else cell += c;
        }
        if (cell || row.length) {
          row.push(cell);
          rows.push(row);
        }
        return rows;
      }
      async function loadBooks() {
        $("libprog").hidden = false;
        try {
          const res = await fetch(SHEET_CSV_URL);
          if (!res.ok) throw new Error(res.status);
          const [head, ...rows] = parseCSV(await res.text());
          const keys = head.map((h) => h.trim().toLowerCase());
          BOOKS = rows
            .filter((r) => r.some((c) => c.trim()))
            .map((r) => {
              const o = {};
              keys.forEach((k, i) => (o[k] = (r[i] || "").trim()));
              return {
                category: o.category || "Library",
                title: o.title || "Magazine",
                sub: o.sub || "",
                author: o.author || "",
                color: o.color || "#a23b4a",
                driveId: o.driveid,
                pdf: o.pdf,
                cover: coverUrl(o),
                ...iconFields(o),
                uid: o.id || o.uniqueid || o.uid || o.driveid || o.pdf,
                publisher: o.publisher || "",
                language: o.language || "",
                year: o.year || "",
                pagesN: o.pages || "",
                summary: o.summary || o.description || "",
              };
            });
          const fa = {},
            im = {}; // Font Awesome first, uploaded image as the fallback
          BOOKS.forEach((b) => {
            if (b.icon && !fa[b.category]) fa[b.category] = b.icon;
            if (b.iconImg && !im[b.category]) im[b.category] = b.iconImg;
          });
          BOOKS.forEach((b) => {
            CAT_ICON[b.category] = fa[b.category]
              ? { fa: fa[b.category] }
              : im[b.category]
                ? { img: im[b.category] }
                : null;
          });
          renderShelves();
          route();
        } catch (err) {
          console.error(err);
          $("shelves").innerHTML =
            `<p class="empty">Couldn't load the library. Please try again later.</p>`;
        } finally {
          $("libprog").hidden = true;
        }
      }
      function coverEl(b) {
        const wrap = document.createElement("span");
        wrap.className = "b3d";
        wrap.innerHTML = `<span class="pages"></span><span class="cover"><span class="ph"><b></b><span></span></span></span>`;
        const cv = wrap.querySelector(".cover");
        cv.style.setProperty("--c", b.color);
        wrap.querySelector(".ph b").textContent = b.title;
        wrap.querySelector(".ph span").textContent = b.sub;
        if (b.cover) {
          cv._load = () => {
            const im = new Image();
            im.alt = "";
            im.onerror = () => im.remove();
            cv.appendChild(im);
            loadCover(im, b.cover);
          };
          io.observe(cv); // fetch the cover only when it is near the screen
        }
        return wrap;
      }
      function makeCard(b) {
        const el = document.createElement("button");
        el.className = "card";
        el.setAttribute("aria-label", `${b.title}, ${b.sub}`);
        const ct = document.createElement("span"),

      function makeCarousel(nodes) {
        const car = document.createElement("div");
        car.className = "car";

    <button class="ibtn nav prev" aria-label="Previous"><svg class="i"><use href="#i-left"/></svg></button>
    <button class="ibtn nav next" aria-label="Next"><svg class="i"><use href="#i-right"/></svg></button>`;
        const track = car.querySelector(".track"),
          prev = car.querySelector(".prev"),
          next = car.querySelector(".next");
        nodes.forEach((n) => track.appendChild(n));
        car._upd = () => {
          prev.hidden = track.scrollLeft <= 2;
          next.hidden =
            track.scrollLeft + track.clientWidth >= track.scrollWidth - 2;
        };
        prev.onclick = () =>
          track.scrollBy({
            left: -track.clientWidth * 0.9,
            behavior: "smooth",
          });
        next.onclick = () =>
          track.scrollBy({ left: track.clientWidth * 0.9, behavior: "smooth" });
        track.addEventListener("scroll", car._upd, { passive: true });
        return car;
      }
      function renderShelves() {
        const s = $("q").value.trim().toLowerCase();
        const list = BOOKS.filter((b) =>
          `${b.title} ${b.sub} ${b.author} ${b.category}`
            .toLowerCase()
            .includes(s),
        );
        const all = [...new Set(BOOKS.map((b) => b.category))];
        const groups = new Map();
        list.forEach((b) => {
          if (!groups.has(b.category)) groups.set(b.category, []);
          groups.get(b.category).push(b);
        });
        const root = $("shelves");
        root.innerHTML = "";
        if (!groups.size) {
          root.innerHTML = `<p class="empty">No books found.</p>`;
          return;
        }
        if (!s && all.length > 1) {
          const g = document.createElement("section");
          g.className = "genres";
          g.innerHTML = `<div class="cat-h"><h2>Books by Genre</h2></div>`;
          const tiles = all.map((name, i) => {
            const t = document.createElement("button");
            t.className = "tile";
            t.innerHTML = `<span class="ti"></span><span class="tn"></span><span class="tc">Books: <b></b></span>`;
            const ti = t.querySelector(".ti"),
              letter = [...name][0].toUpperCase(),
              spec = CAT_ICON[name];
            ti.style.background = PALETTE[i % PALETTE.length];
            if (spec)
              ti.appendChild(
                makeIcon(spec, () => {
                  ti.textContent = letter;
                }),
              );
            else ti.textContent = letter;
            t.querySelector(".tn").textContent = name;
            t.querySelector("b").textContent = BOOKS.filter(
              (b) => b.category === name,
            ).length;
            t.onclick = () =>
              document
                .getElementById("cat-" + i)
                .scrollIntoView({ behavior: "smooth", block: "start" });
            return t;
          });
          g.appendChild(makeCarousel(tiles));
          root.appendChild(g);
        }
        groups.forEach((books, name) => {
          const sec = document.createElement("section");
          sec.className = "cat";
          sec.id = "cat-" + all.indexOf(name);
          if (s) sec.dataset.open = "1"; // while searching, show every match
          sec.innerHTML = `<div class="cat-h"><h2></h2><button class="btn tonal va">View All</button></div>`;
          const h2 = sec.querySelector("h2");
          if (CAT_ICON[name]) h2.append(headIcon(CAT_ICON[name]), " " + name);
          else h2.textContent = name;
          sec.appendChild(makeCarousel(books.map(makeCard)));
          sec.querySelector(".va").onclick = () => {
            sec.dataset.open = sec.dataset.open === "1" ? "" : "1";
            updateCarousels();
          };
          root.appendChild(sec);
        });
        updateCarousels();
      }
      function updateCarousels() {
        // "View All" only appears when a row overflows
        const searching = !!$("q").value.trim();
        document.querySelectorAll(".cat").forEach((sec) => {
          const track = sec.querySelector(".track"),
            btn = sec.querySelector(".va"),
            open = sec.dataset.open === "1";
          btn.textContent = open ? "Show less" : "View All";
          btn.hidden =
            searching || (!open && track.scrollWidth <= track.clientWidth + 2);
        });
        document.querySelectorAll(".car").forEach((c) => c._upd());
      }
      $("q").oninput = renderShelves;

      /* ---------- navigation: #read=<id> = details, #read=<id>&page=<n> = reader ---------- */
      const syncLock = () =>
        document.documentElement.classList.toggle(
          "lock",
          detailOpen || readerOn,
        );
      const linkFor = (uid, page) =>
        `${location.origin}${location.pathname}#read=${encodeURIComponent(uid)}${page ? `&page=${page}` : ""}`;
      function parseHash() {
        const m = location.hash.match(/^#read=([^&]+)(?:&page=(\d+))?/);
        return m
          ? { id: decodeURIComponent(m[1]), page: m[2] ? +m[2] : null }
          : null;
      }
      function go(h) {
        history.pushState({ app: 1 }, "", h);
        route();
      }
      function route() {
        const h = parseHash(),
          b = h && BOOKS.find((x) => x.uid === h.id);
        if (!b) {
          hideDetail();
          if (readerOn) teardown();
          return;
        }
        if (h.page != null) {
          hideDetail();
          if (!readerOn || curId !== b.uid) openBook(b, h.page - 1);
        } else {
          if (readerOn) teardown();
          showDetail(b);
        }
      }
      const fromHome = () => {
        history.replaceState(null, "", location.pathname + location.search);
        route();
      };
      function closeDetail() {
        if (history.state && history.state.app) history.back();
        else fromHome();
      }
      function closeReader() {
        if (history.state && history.state.app) history.back();
        else if (curId) {
          history.replaceState(null, "", `#read=${encodeURIComponent(curId)}`);
          route();
        } else fromHome();
      }
      addEventListener("popstate", route);

      async function share(title, subtitle, url) {
        const text = `${title}${subtitle ? " · " + subtitle : ""} | ${SITE_NAME}`;
        try {
          if (navigator.share) {
            await navigator.share({
              title: `${title} — ${SITE_NAME}`,
              text,
              url,
            });
            return;
          }
        } catch (e) {
          if (e.name === "AbortError") return;
        }
        const full = `${text}\n${url}`; // fallback: copy "title · subtitle | site" + link
        try {
          await navigator.clipboard.writeText(full);
          snack("Link copied");
        } catch (e) {
          prompt("Copy this link", full);
        }
      }
      function snack(msg) {
        const s = $("snack");
        s.textContent = msg;
        s.classList.add("on");
        clearTimeout(s._t);
        s._t = setTimeout(() => s.classList.remove("on"), 2400);
      }

      /* ---------- book details dialog ---------- */
      const FIELDS = [
        ["author", "Authors", "fa-user-pen"],
        ["publisher", "Publisher", "fa-building-columns"],
        ["category", "Genre", "fa-tags"],
        ["language", "Language", "fa-language"],
        ["sub", "Issue", "fa-bookmark"],
        ["year", "Year", "fa-calendar-days"],
        ["pagesN", "Pages", "fa-file-lines"],
      ];
      function showDetail(b) {
        $("dtitle").textContent = b.title;
        const rows = $("drows");
        rows.innerHTML = "";
        FIELDS.forEach(([k, label, ic]) => {
          if (!b[k]) return;
          const r = document.createElement("div");
          r.className = "d-row";
          r.innerHTML = `<i class="fa-solid ${ic}"></i><span class="dl"></span><b class="dv"></b>`;
          r.querySelector(".dl").textContent = label;
          r.querySelector(".dv").textContent = b[k];
          rows.appendChild(r);
        });
        $("dcover").innerHTML = "";
        $("dcover").appendChild(coverEl(b));
        $("dsumwrap").hidden = !b.summary;
        $("dsum").textContent = b.summary;
        $("dread").onclick = () =>
          go(`#read=${encodeURIComponent(b.uid)}&page=1`);
        $("dshare").onclick = () => share(b.title, b.sub, linkFor(b.uid));
        $("detail").hidden = false;
        detailOpen = true;
        syncLock();
        $("dread").focus();
      }
      function hideDetail() {
        if (!detailOpen) return;
        $("detail").hidden = true;
        detailOpen = false;
        syncLock();
      }
      $("dclose").onclick = closeDetail;
      $("detail").addEventListener("click", (e) => {
        if (e.target === $("detail")) closeDetail();
      });

      /* ---------- reader ---------- */
      function showMsg(text, pct, err) {
        $("msg").classList.remove("hide");
        $("mtxt").textContent = text;
        $("mspin").hidden = $("prog").hidden = !!err;
        $("prog").className = "linear" + (pct == null ? " ind" : "");
        if (pct != null) $("prog").firstElementChild.style.width = pct + "%";
      }
      function destroyFlip() {
        if (flip) {
          try {
            flip.destroy();
          } catch (e) {}
          flip = null;
        }
        $("stage").innerHTML = "";
      }
      function freePages() {
        pages.forEach((u) => u && URL.revokeObjectURL(u));
        pages = [];
        pageEls = [];
      }
      function fitWidth() {
        // page width at which the whole book fits the stage (no scrollbars)
        const st = $("stage"),
          W = st.clientWidth - PAD,
          H = st.clientHeight - PAD;
        return Math.min(W < 720 ? W : W / 2, H * ratio);
      }
      function fill(d, i) {
        // image, spinner (still rendering) or error + retry
        d.innerHTML = "";
        if (pages[i]) {
          const im = new Image();
          im.src = pages[i];
          im.alt = `Page ${i + 1}`;
          im.draggable = false;
          d.appendChild(im);
          return;
        }
        const s = document.createElement("span");
        if (pages[i] === null) {
          s.className = "spin";
          s.innerHTML = SPIN;
        } else {
          s.className = "fail";
          const m = document.createElement("span");
          m.textContent = "Couldn't load this page";
          const bt = document.createElement("button");
          bt.className = "btn filled retry";
          bt.textContent = "Retry";
          bt.onclick = () => retryHook && retryHook(i);
          ["mousedown", "touchstart", "pointerdown"].forEach((ev) =>
            bt.addEventListener(ev, (e) => e.stopPropagation()),
          );
          s.append(m, bt);
        }
        d.appendChild(s);
      }
      function showPage(i) {
        if (pageEls[i]) fill(pageEls[i], i);
      }
      function build(start) {
        destroyFlip();
        const st = $("stage"),
          portrait = st.clientWidth - PAD < 720,
          n = pages.length;
        const pw = Math.floor(fitWidth() * zoom),
          ph = Math.floor(pw / ratio);
        st.classList.toggle("zoomed", zoom > 1);
        const host = document.createElement("div");
        host.className = "flip";
        host.style.cssText = `width:${portrait ? pw : pw * 2}px;height:${ph}px`;
        st.appendChild(host);
        pageEls = [];
        for (let i = 0; i < n; i++) {
          const d = document.createElement("div");
          d.className = "page";
          if (i === 0 || i === n - 1) d.dataset.density = "hard";
          fill(d, i);
          host.appendChild(d);
          pageEls.push(d);
        }
        flip = new St.PageFlip(host, {
          width: pw,
          height: ph,
          size: "stretch",
          minWidth: pw * 0.9,
          maxWidth: pw * 1.5,
          minHeight: ph * 0.5,
          maxHeight: ph * 1.5,
          showCover: true,
          maxShadowOpacity: 0.5,
          usePortrait: true,
          mobileScrollSupport: true,
          useMouseEvents: zoom === 1, // when zoomed, swiping/dragging scrolls instead of flipping
        });
        flip.loadFromHTML(host.querySelectorAll(".page"));
        if (start > 0) flip.turnToPage(start);
        flip.on("flip", (e) => {
          cur = e.data;
          updateUI();
        });
        updateUI();
      }
      function setSeek(v) {
        const n = pages.length;
        $("seek").style.setProperty(
          "--p",
          (n > 1 ? ((v - 1) / (n - 1)) * 100 : 0) + "%",
        );
      }
      function updateUI() {
        if (!flip) return;
        cur = Math.min(flip.getCurrentPageIndex(), pages.length - 1);
        if (curId)
          history.replaceState(
            history.state,
            "",
            `#read=${encodeURIComponent(curId)}&page=${cur + 1}`,
          );
        $("seek").value = cur + 1;
        $("goto").value = cur + 1;
        setSeek(cur + 1);
        $("prev").disabled = cur <= 0;
        $("next").disabled = cur >= pages.length - 1;
        $("zval").textContent = Math.round(zoom * 100) + "%";
        $("zout").disabled = zoom <= ZOOMS[0];
        $("zin").disabled = zoom >= ZOOMS[ZOOMS.length - 1];
      }
      function goTo(n) {
        if (!flip) return;
        n = Math.max(1, Math.min(pages.length, parseInt(n, 10) || 1));
        flip.turnToPage(n - 1);
        updateUI();
      }
      function setZoom(z) {
        zoom = z;
        build(cur);
      }

      async function openBook(b, start = 0) {
        const my = ++token;
        destroyFlip();
        freePages();
        zoom = 1;
        cur = Math.max(0, start);
        readerOn = true;
        curId = b.uid;
        curBook = b;
        syncLock();
        $("reader").classList.remove("ready");
        $("reader").classList.add("on");
        $("rtitle").textContent = `${b.title} — ${b.sub}`;
        $("bg").classList.add("done");
        $("bg").firstElementChild.style.width = "0";
        showMsg("Opening the issue…", 0);

        const id = b.driveId || b.pdf;
        const url =
          b.pdf ||
          `https://www.googleapis.com/drive/v3/files/${b.driveId}?alt=media&key=${DRIVE_API_KEY}`;
        // render size: sharp on retina screens and at 300% zoom; bucketed so cached pages are reused
        const dpr = Math.min(window.devicePixelRatio || 1, 3),
          cap = innerWidth < 720 ? 1800 : 2400;
        const stW = $("stage").clientWidth - PAD;
        const target =
          Math.round(
            Math.min(
              cap,
              Math.max(1400, (stW < 720 ? stW : stW / 2) * dpr * 2.5),
            ) / 200,
          ) * 200;
        const mk = metaKey(id, target);
        let revealed = false,
          pdfP = null;
        const getPdf = () =>
          pdfP ||
          (pdfP = (async () => {
            // only downloaded if some page isn't cached
            if (PROXY_URL && b.driveId && !b.pdf) {
              if (!revealed) showMsg("Downloading the issue…");
              const blob = await proxyBlob(b.driveId, "file");
              return await pdfjsLib.getDocument({
                data: new Uint8Array(await blob.arrayBuffer()),
              }).promise;
            }
            const task = pdfjsLib.getDocument({ url });
            task.onProgress = (p) => {
              if (!revealed && my === token && p.total)
                showMsg("Downloading the issue…", (p.loaded / p.total) * 100);
            };
            return await task.promise;
          })().catch((e) => {
            pdfP = null;
            throw e;
          }));
        const renderOne = async (i) => {
          let blob = await cacheGet(pageKey(id, target, i));
          if (blob) return blob;
          const pdf = await getPdf();
          const page = await pdf.getPage(i + 1);
          const vp = page.getViewport({
            scale: target / page.getViewport({ scale: 1 }).width,
          });
          const c = document.createElement("canvas");
          c.width = vp.width;
          c.height = vp.height;
          await page.render({ canvasContext: c.getContext("2d"), viewport: vp })
            .promise;
          blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.92));
          c.width = c.height = 0;
          cachePut(pageKey(id, target, i), blob);
          return blob;
        };
        const renderRetry = async (i) => {
          // one automatic retry before giving up
          try {
            return await renderOne(i);
          } catch (e) {
            await new Promise((r) => setTimeout(r, 700));
            return await renderOne(i);
          }
        };
        retryHook = async (i) => {
          // the "Retry" button on a failed page
          if (my !== token) return;
          pages[i] = null;
          showPage(i);
          try {
            const blob = await renderRetry(i);
            if (my !== token) return;
            pages[i] = URL.createObjectURL(blob);
          } catch (e) {
            console.error(e);
            pages[i] = "";
          }
          showPage(i);
        };
        try {
          let meta = readMeta(mk);
          if (!meta) {
            const pdf = await getPdf();
            if (my !== token) return;
            const v0 = (await pdf.getPage(1)).getViewport({ scale: 1 });
            meta = { n: pdf.numPages, ratio: v0.width / v0.height };
            writeMeta(mk, meta);
          }
          ratio = meta.ratio;
          pages = new Array(meta.n).fill(null);
          cur = Math.min(cur, meta.n - 1);
          $("seek").max = meta.n;
          $("goto").max = meta.n;
          $("total").textContent = meta.n;
          const K = Math.min(2, meta.n);
          let done = 0;
          const next = () => {
            // page closest to the reader's position, slightly favouring forward
            let best = -1,
              bd = Infinity;
            for (let i = 0; i < pages.length; i++)
              if (pages[i] === null) {
                const d = i >= cur ? i - cur : (cur - i) * 1.5;
                if (d < bd) {
                  bd = d;
                  best = i;
                }
              }
            return best;
          };
          for (;;) {
            const i = next();
            if (i < 0) break;
            let blob = null;
            try {
              blob = await renderRetry(i);
            } catch (e) {
              console.error(e);
              if (!revealed) throw e;
              if (my !== token) return;
              pages[i] = "";
              showPage(i);
              continue;
            }
            if (my !== token) return;
            pages[i] = URL.createObjectURL(blob);
            done++;
            if (revealed) showPage(i);
            else if (done >= K) {
              revealed = true;
              $("msg").classList.add("hide");
              $("reader").classList.add("ready");
              build(cur);
            } else showMsg(`Loading page ${done} of ${K}`, (done / K) * 100);
            $("bg").classList.toggle("done", done >= meta.n); // thin bar = the rest loads in the background
            $("bg").firstElementChild.style.width = (done / meta.n) * 100 + "%";
          }
        } catch (err) {
          console.error(err);
          if (my === token) {
            destroyFlip();
            const code =
              err &&
              (err.status ||
                (String(err.message).match(/\((\d{3})\)/) || [])[1]);
            let why = "Couldn't load this issue.";
            if (+code === 401 || +code === 403)
              why +=
                " Google refused access (HTTP " +
                code +
                "). With the API key the file must be shared as “Anyone with the link”, and the key must allow this website. For private files, set PROXY_URL.";
            else if (+code === 404)
              why +=
                " File not found (HTTP 404). Check the driveId in the sheet.";
            else if (err && err.message) why += " (" + err.message + ")";
            showMsg(why, null, true);
          }
        }
      }
      function teardown() {
        token++;
        retryHook = null;
        curId = null;
        curBook = null;
        destroyFlip();
        freePages();
        $("reader").classList.remove("on", "ready");
        readerOn = false;
        syncLock();
      }

      $("close").onclick = closeReader;
      $("rshare").onclick = () =>
        curBook &&
        share(
          curBook.title,
          `${curBook.sub} · page ${cur + 1}`,
          linkFor(curId, cur + 1),
        );
      $("prev").onclick = () => flip && flip.flipPrev();
      $("next").onclick = () => flip && flip.flipNext();
      $("zin").onclick = () =>
        setZoom(ZOOMS[Math.min(ZOOMS.indexOf(zoom) + 1, ZOOMS.length - 1)]);
      $("zout").onclick = () =>
        setZoom(ZOOMS[Math.max(ZOOMS.indexOf(zoom) - 1, 0)]);
      $("zval").onclick = () => setZoom(1);
      $("gobtn").onclick = () => goTo($("goto").value);
      $("goto").onkeydown = (e) => {
        if (e.key === "Enter") goTo(e.target.value);
      };
      $("seek").oninput = (e) => {
        $("goto").value = e.target.value;
        setSeek(+e.target.value);
      };
      $("seek").onchange = (e) => goTo(e.target.value);

      let drag = null;
      const stage = $("stage"); // mouse drag to pan when zoomed (touch uses native scrolling)
      stage.addEventListener("pointerdown", (e) => {
        if (zoom <= 1 || e.pointerType !== "mouse" || e.button !== 0) return;
        drag = {
          x: e.clientX,
          y: e.clientY,
          l: stage.scrollLeft,
          t: stage.scrollTop,
        };
        stage.setPointerCapture(e.pointerId);
        stage.classList.add("grabbing");
      });
      stage.addEventListener("pointermove", (e) => {
        if (!drag) return;
        stage.scrollLeft = drag.l - (e.clientX - drag.x);
        stage.scrollTop = drag.t - (e.clientY - drag.y);
      });
      ["pointerup", "pointercancel"].forEach((t) =>
        stage.addEventListener(t, () => {
          drag = null;
          stage.classList.remove("grabbing");
        }),
      );

      addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (readerOn) closeReader();
          else if (detailOpen) closeDetail();
          return;
        }
        if (!readerOn || e.target.tagName === "INPUT") return;
        if (e.key === "ArrowLeft" && flip) flip.flipPrev();
        if (e.key === "ArrowRight" && flip) flip.flipNext();
        if ((e.key === "+" || e.key === "=") && !$("zin").disabled)
          $("zin").click();
        if (e.key === "-" && !$("zout").disabled) $("zout").click();
      });
      let rz;
      addEventListener("resize", () => {
        updateCarousels();
        clearTimeout(rz);
        rz = setTimeout(() => {
          if (flip && pages.length) build(cur);
        }, 250);
      });
      addEventListener(
        "scroll",
        () => {
          $("top").hidden = scrollY < 400;
        },
        { passive: true },
      );
      $("top").onclick = () => scrollTo({ top: 0, behavior: "smooth" });
      document.title = SITE_NAME;
      document.querySelector(".brand").textContent = SITE_NAME;
      loadBooks();
    </script>
  </body>
</html>
