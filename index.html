<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Magazine</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ol+Chiki:wght@700&family=Lora:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #f3e9d8;
        --ink: #4a3b2c;
        --wood: #5e3b1e;
        --plank: #9c6b3c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: Lora, Georgia, serif;
        min-height: 100vh;
        padding: 40px 16px 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      h1 {
        font-family: "Noto Sans Ol Chiki", Lora, serif;
        font-size: 2rem;
        margin: 0 0 6px;
      }
      .tag {
        margin: 0 0 28px;
        opacity: 0.75;
      }
      #q {
        width: min(480px, 100%);
        padding: 14px 22px;
        font: inherit;
        font-size: 1.1rem;
        border: 1px solid var(--ink);
        border-radius: 999px;
        background: #faf3e6;
        color: var(--ink);
      }
      #q:focus-visible {
        outline: 3px solid var(--plank);
        outline-offset: 2px;
      }

      /* shelf */
      .shelf {
        margin-top: 56px;
        width: min(860px, 100%);
      }
      .frame {
        background: var(--wood);
        border-radius: 14px 14px 0 0;
        padding: 22px 22px 0;
        box-shadow: 0 30px 40px -20px rgba(60, 35, 10, 0.45);
      }
      .inner {
        background: linear-gradient(#1f1209, #40291b);
        min-height: 480px;
        padding: 50px 32px 0;
        display: flex;
        align-items: flex-end;
        gap: 16px;
        flex-wrap: wrap;
        align-content: flex-end;
        box-shadow: inset 0 14px 22px rgba(0, 0, 0, 0.5);
      }
      .plank {
        height: 24px;
        background: var(--plank);
        margin: 0 22px;
      }
      .base {
        height: 22px;
        background: #4a2b14;
        border-radius: 4px;
        margin: 0 -8px;
        box-shadow: 0 18px 26px -8px rgba(60, 35, 10, 0.5);
      }
      .book {
        all: unset;
        cursor: pointer;
        position: relative;
        display: block;
        border-radius: 5px 5px 0 0;
        color: #fff;
        box-shadow:
          inset -6px 0 8px rgba(0, 0, 0, 0.25),
          inset 3px 0 4px rgba(255, 255, 255, 0.12);
        transition: transform 0.2s;
      }
      .book:hover,
      .book:focus-visible {
        transform: translateY(-14px);
      }
      .book:focus-visible {
        outline: 3px solid #fff;
      }
      .book::before,
      .book::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        height: 8px;
        background: rgba(255, 255, 255, 0.4);
      }
      .book::before {
        top: 14px;
      }
      .book::after {
        bottom: 18px;
      }
      .spine {
        position: absolute;
        inset: 34px 0 34px;
        writing-mode: vertical-rl;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 12px;
        padding: 0 6px;
        font-size: 0.95rem;
        letter-spacing: 0.06em;
      }
      .spine b {
        font-family: "Noto Sans Ol Chiki", Lora, serif;
        font-size: 1.5rem;
        letter-spacing: 0;
      }
      .count {
        margin-top: 34px;
        opacity: 0.75;
      }

      /* reader */
      #reader {
        position: fixed;
        inset: 0;
        background: rgba(25, 15, 8, 0.96);
        display: none;
        flex-direction: column;
        z-index: 10;
        color: #f3e9d8;
      }
      #reader.on {
        display: flex;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
      }
      .bar .t {
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #reader button {
        font: inherit;
        color: #f3e9d8;
        background: #ffffff1f;
        border: 0;
        border-radius: 8px;
        min-width: 40px;
        height: 40px;
        padding: 0 14px;
        cursor: pointer;
      }
      #reader button:hover:not(:disabled) {
        background: #ffffff38;
      }
      #reader button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      #stage {
        flex: 1;
        display: flex;
        min-height: 0;
        overflow: auto;
        padding: 8px;
      }
      .flip {
        margin: auto;
        flex: none;
      }
      .page {
        background: #fff;
      }
      .page img {
        width: 100%;
        height: 100%;
        display: block;
        user-select: none;
        -webkit-user-drag: none;
      }
      #msg {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-align: center;
        padding: 24px;
        pointer-events: none;
      }
      #msg.hide {
        display: none;
      }
      #prog {
        width: 220px;
        height: 6px;
        border-radius: 3px;
        background: #ffffff30;
        overflow: hidden;
      }
      #prog i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--plank);
      }
      .tools {
        display: none;
        padding: 8px 14px calc(12px + env(safe-area-inset-bottom, 0px));
        background: #0000004d;
      }
      #reader.ready .tools {
        display: block;
      }
      #seek {
        width: 100%;
        accent-color: var(--plank);
        margin: 0 0 8px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
      }
      .go {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #goto {
        width: 64px;
        height: 40px;
        font: inherit;
        text-align: center;
        border-radius: 8px;
        border: 0;
        background: #faf3e6;
        color: var(--ink);
      }
      .zoom {
        display: flex;
        gap: 4px;
      }
      #zval {
        min-width: 64px;
      }
      @media (prefers-reduced-motion: reduce) {
        .book {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <h1>Magazine</h1>
    <p class="tag">Pick an issue from the shelf to read it.</p>
    <input
      id="q"
      type="search"
      placeholder="Search title or author…"
      aria-label="Search issues"
    />

    <div class="shelf">
      <div class="frame"><div class="inner" id="books"></div></div>
      <div class="plank"></div>
      <div class="base"></div>
    </div>
    <p class="count" id="count"></p>

    <div
      id="reader"
      role="dialog"
      aria-modal="true"
      aria-label="Magazine reader"
    >
      <div class="bar">
        <span class="t" id="rtitle"></span><button id="close">Close</button>
      </div>
      <div id="stage"></div>
      <div id="msg" class="hide">
        <div id="mtxt"></div>
        <div id="prog"><i></i></div>
      </div>
      <div class="tools">
        <input
          type="range"
          id="seek"
          min="1"
          max="1"
          value="1"
          aria-label="Reading progress"
        />
        <div class="row">
          <button id="prev" aria-label="Previous page">‹</button>
          <label class="go"
            >Page
            <input id="goto" type="number" min="1" inputmode="numeric" /> /
            <span id="total">0</span> <button id="gobtn">Go</button></label
          >
          <span class="zoom">
            <button id="zout" aria-label="Zoom out">−</button>
            <button id="zval" aria-label="Reset zoom">100%</button>
            <button id="zin" aria-label="Zoom in">+</button>
          </span>
          <button id="next" aria-label="Next page">›</button>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <script>
      /* ===== EDIT THIS PART ===== */
      // Google Cloud API key with "Google Drive API" enabled.
      const DRIVE_API_KEY = "AIzaSyBAfeEO3OWZqrnGMqoYO5r9cPPcT5CLZSg";
      // Published CSV link of your Google Sheet (Share → Publish to web → pick the tab → CSV).
      // Sheet columns (row 1 = headers): title, sub, author, color, w, h, driveId, pdf
      const SHEET_CSV_URL =
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vTREzHC7NabWD51Mn0I_6_uZpdd-LnaCFCfl7XWJxcwpTDrrCFJF33iVedZBcGrx1f6HO97IMucQ1bw/pub?gid=0&single=true&output=csv";
      /* ========================== */

      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const $ = (id) => document.getElementById(id);
      let BOOKS = [],
        flip = null,
        token = 0,
        pages = [],
        ratio = 0.7,
        zoom = 1,
        cur = 0;
      const ZOOMS = [1, 1.5, 2, 3];

      /* ---------- shelf ---------- */
      function parseCSV(text) {
        const rows = [];
        let row = [],
          cell = "",
          q = false;
        for (let i = 0; i < text.length; i++) {
          const c = text[i];
          if (q) {
            if (c === '"') {
              if (text[i + 1] === '"') {
                cell += '"';
                i++;
              } else q = false;
            } else cell += c;
          } else if (c === '"') q = true;
          else if (c === ",") {
            row.push(cell);
            cell = "";
          } else if (c === "\n" || c === "\r") {
            if (c === "\r" && text[i + 1] === "\n") i++;
            row.push(cell);
            rows.push(row);
            row = [];
            cell = "";
          } else cell += c;
        }
        if (cell || row.length) {
          row.push(cell);
          rows.push(row);
        }
        return rows;
      }
      async function loadBooks() {
        $("count").textContent = "Loading the shelf…";
        try {
          const res = await fetch(SHEET_CSV_URL);
          if (!res.ok) throw new Error(res.status);
          const [head, ...rows] = parseCSV(await res.text());
          const keys = head.map((h) => h.trim().toLowerCase());
          BOOKS = rows
            .filter((r) => r.some((c) => c.trim()))
            .map((r) => {
              const o = {};
              keys.forEach((k, i) => (o[k] = (r[i] || "").trim()));
              return {
                title: o.title || "Magazine",
                sub: o.sub,
                author: o.author,
                color: o.color || "#a23b4a",
                w: +o.w || 96,
                h: +o.h || 400,
                driveId: o.driveid,
                pdf: o.pdf,
              };
            });
          renderShelf(BOOKS);
        } catch (err) {
          console.error(err);
          $("count").textContent =
            "Couldn't load the shelf. Please try again later.";
        }
      }
      function renderShelf(list) {
        const box = $("books");
        box.innerHTML = "";
        list.forEach((b) => {
          const el = document.createElement("button");
          el.className = "book";
          el.style.cssText = `width:${b.w}px;height:${b.h}px;background:${b.color}`;
          el.setAttribute("aria-label", `${b.title}, ${b.sub}`);
          el.innerHTML = `<span class="spine"><b></b><span></span></span>`;
          el.querySelector("b").textContent = b.title;
          el.querySelector(".spine span").textContent = b.sub;
          el.onclick = () => openBook(b);
          box.appendChild(el);
        });
        $("count").textContent =
          `${list.length} book${list.length === 1 ? "" : "s"} on the shelf`;
      }
      $("q").oninput = (e) => {
        const s = e.target.value.trim().toLowerCase();
        renderShelf(
          BOOKS.filter((b) =>
            `${b.title} ${b.sub} ${b.author || ""}`.toLowerCase().includes(s),
          ),
        );
      };

      /* ---------- reader ---------- */
      function showMsg(text, pct) {
        $("msg").classList.remove("hide");
        $("mtxt").textContent = text;
        $("prog").style.display = pct == null ? "none" : "block";
        if (pct != null) $("prog").firstElementChild.style.width = pct + "%";
      }
      function destroyFlip() {
        if (flip) {
          try {
            flip.destroy();
          } catch (e) {}
          flip = null;
        }
        $("stage").innerHTML = "";
      }
      function freePages() {
        pages.forEach((u) => URL.revokeObjectURL(u));
        pages = [];
      }

      // width (CSS px) of one page when the whole spread fits the screen at 100%
      function fitWidth() {
        const st = $("stage"),
          W = st.clientWidth - 16,
          H = st.clientHeight - 16;
        return Math.min(W < 720 ? W : W / 2, H * ratio);
      }
      function build(start) {
        destroyFlip();
        const portrait = $("stage").clientWidth - 16 < 720;
        const pw = Math.floor(fitWidth() * zoom),
          ph = Math.floor(pw / ratio);
        const host = document.createElement("div");
        host.className = "flip";
        host.style.cssText = `width:${portrait ? pw : pw * 2}px;height:${ph}px`;
        $("stage").appendChild(host);
        pages.forEach((u, i) => {
          const d = document.createElement("div");
          d.className = "page";
          if (i === 0 || i === pages.length - 1) d.dataset.density = "hard";
          const im = new Image();
          im.src = u;
          im.alt = `Page ${i + 1}`;
          im.draggable = false;
          d.appendChild(im);
          host.appendChild(d);
        });
        flip = new St.PageFlip(host, {
          width: pw,
          height: ph,
          size: "stretch",
          minWidth: pw * 0.9,
          maxWidth: pw * 1.5,
          minHeight: ph * 0.5,
          maxHeight: ph * 1.5,
          showCover: true,
          maxShadowOpacity: 0.5,
          mobileScrollSupport: true,
          usePortrait: true,
        });
        flip.loadFromHTML(host.querySelectorAll(".page"));
        if (start > 0) flip.turnToPage(start);
        flip.on("flip", (e) => {
          cur = e.data;
          updateUI();
        });
        updateUI();
      }
      function updateUI() {
        if (!flip) return;
        cur = Math.min(flip.getCurrentPageIndex(), pages.length - 1);
        $("seek").value = cur + 1;
        $("goto").value = cur + 1;
        $("prev").disabled = cur <= 0;
        $("next").disabled = cur >= pages.length - 1;
        $("zval").textContent = Math.round(zoom * 100) + "%";
        $("zout").disabled = zoom <= ZOOMS[0];
        $("zin").disabled = zoom >= ZOOMS[ZOOMS.length - 1];
      }
      function goTo(n) {
        if (!flip) return;
        n = Math.max(1, Math.min(pages.length, parseInt(n, 10) || 1));
        flip.turnToPage(n - 1);
        updateUI();
      }
      function setZoom(z) {
        zoom = z;
        build(cur);
      }

      async function openBook(b) {
        const my = ++token;
        destroyFlip();
        freePages();
        zoom = 1;
        cur = 0;
        $("reader").classList.remove("ready");
        $("reader").classList.add("on");
        $("rtitle").textContent = `${b.title} — ${b.sub}`;
        showMsg("Opening the issue…", 0);
        const tmp = [];
        try {
          const url =
            b.pdf ||
            `https://www.googleapis.com/drive/v3/files/${b.driveId}?alt=media&key=${DRIVE_API_KEY}`;
          const pdf = await pdfjsLib.getDocument({ url }).promise;
          const v0 = (await pdf.getPage(1)).getViewport({ scale: 1 });
          ratio = v0.width / v0.height;
          // render big enough to stay sharp on retina screens and at 300% zoom
          const dpr = Math.min(window.devicePixelRatio || 1, 3);
          const cap = innerWidth < 720 ? 1800 : 2400;
          const target = Math.min(cap, Math.max(1400, fitWidth() * dpr * 2.5));
          const scale = target / v0.width;
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const vp = page.getViewport({ scale });
            const c = document.createElement("canvas");
            c.width = vp.width;
            c.height = vp.height;
            await page.render({
              canvasContext: c.getContext("2d"),
              viewport: vp,
            }).promise;
            const blob = await new Promise((r) =>
              c.toBlob(r, "image/jpeg", 0.92),
            );
            c.width = c.height = 0;
            tmp.push(URL.createObjectURL(blob));
            if (my !== token) {
              tmp.forEach((u) => URL.revokeObjectURL(u));
              return;
            }
            showMsg(
              `Loading page ${i} of ${pdf.numPages}`,
              (i / pdf.numPages) * 100,
            );
          }
          pages = tmp;
          $("seek").max = pages.length;
          $("goto").max = pages.length;
          $("total").textContent = pages.length;
          $("msg").classList.add("hide");
          $("reader").classList.add("ready");
          build(0);
        } catch (err) {
          console.error(err);
          tmp.forEach((u) => URL.revokeObjectURL(u));
          showMsg("Couldn't load this issue. Please try again later.");
        }
      }
      function closeReader() {
        token++;
        destroyFlip();
        freePages();
        $("reader").classList.remove("on", "ready");
      }

      $("close").onclick = closeReader;
      $("prev").onclick = () => flip && flip.flipPrev();
      $("next").onclick = () => flip && flip.flipNext();
      $("zin").onclick = () =>
        setZoom(ZOOMS[Math.min(ZOOMS.indexOf(zoom) + 1, ZOOMS.length - 1)]);
      $("zout").onclick = () =>
        setZoom(ZOOMS[Math.max(ZOOMS.indexOf(zoom) - 1, 0)]);
      $("zval").onclick = () => setZoom(1);
      $("gobtn").onclick = () => goTo($("goto").value);
      $("goto").onkeydown = (e) => {
        if (e.key === "Enter") goTo(e.target.value);
      };
      $("seek").oninput = (e) => {
        $("goto").value = e.target.value;
      };
      $("seek").onchange = (e) => goTo(e.target.value);
      addEventListener("keydown", (e) => {
        if (!$("reader").classList.contains("on")) return;
        if (e.key === "Escape") return closeReader();
        if (e.target.tagName === "INPUT") return;
        if (e.key === "ArrowLeft" && flip) flip.flipPrev();
        if (e.key === "ArrowRight" && flip) flip.flipNext();
      });
      let rz;
      addEventListener("resize", () => {
        clearTimeout(rz);
        rz = setTimeout(() => {
          if (flip && pages.length) build(cur);
        }, 250);
      });
      loadBooks();
    </script>
  </body>
</html>
